<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer glowing gold ring -->
  <circle cx="32" cy="32" r="30" fill="#1C1002" stroke="#C9A84C" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#E8C87A" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  
  <!-- Sacred OM Symbol centered and clear -->
  <text 
    x="32" 
    y="44" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="34" 
    font-weight="bold" 
    fill="url(#goldGradient)" 
    text-anchor="middle"
    filter="drop-shadow(0 2px 3px rgba(0,0,0,0.5))"
  >ॐ</text>

  <!-- Gradient for royal gold finish -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="45%" stop-color="#E8C87A" />
      <stop offset="70%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#9A6F20" />
    </linearGradient>
  </defs>
</svg>
